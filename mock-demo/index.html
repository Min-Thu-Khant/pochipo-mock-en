<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>タメルコ 連動デモ（管理画面 × NACS × アプリ）</title><link rel="stylesheet" href="demo.css"><script type="module" src="../mock-app/english.js"></script></head>
<body>
<header class="bar"><h1><i>P</i>タメルコ 連動デモ</h1><span class="sub">左の管理画面／NACS で変更すると、右のアプリに即時反映されます（同じデータを共有）</span><span class="grow"></span><button id="toggle-guide">シナリオを隠す／表示</button></header>

 <section class="pane"><div class="label"><span class="dot"></span><span id="pane-title">管理画面（運用者）</span><span class="grow"></span><span class="seg" role="tablist" aria-label="左ペインの切り替え"><button role="tab" data-pane="admin" aria-selected="true">タメルコ管理画面</button><button role="tab" data-pane="nacs" aria-selected="false">NACS（案件配信）</button></span></div><div class="admin-wrap"><iframe id="admin-frame" title="管理画面モック"></iframe><iframe id="nacs-frame" title="NACS モック" hidden></iframe></div></section>
 <section class="pane"><div class="label"><span class="dot"></span>アプリ（ユーザー）</div><div class="phone"><iframe id="app-frame" title="アプリモック"></iframe></div></section>
</div>
<div class="guide"><div id="scenarios"></div><div id="caption"></div></div>
<script type="module" src="demo.js"></script>
</body></html>
