<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>アンケート回答ページ・デモ</title>
  <link rel="stylesheet" href="design-system/app-theme/library-tokens.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:300 16px/1.6 var(--ds-font)}
    header{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--canvas)}header small{display:block;color:var(--muted)}
    main{max-width:640px;margin:auto;padding:32px 24px}h1{font-size:22px;line-height:1.4;font-weight:600}h2{font-size:20px}p{margin:16px 0}
    fieldset{padding:0;border:0}legend{margin:12px 0;font-weight:600}label{display:flex;gap:12px;padding:16px 12px;border-bottom:1px solid var(--line)}input{accent-color:var(--primary)}
    button{font:600 16px/1.3 var(--ds-font);border:0;border-radius:999px;background:var(--primary);color:#fff;min-height:48px;padding:12px 24px;cursor:pointer;margin-top:20px;width:100%}
    button.secondary{background:var(--ds-soft);color:var(--ds-label)}button:disabled{background:#eceeee;color:#858585;cursor:default}progress{width:100%;accent-color:var(--primary)}
    #error{color:#b3261e}a{color:var(--ds-label)}
  </style>
</head>
<body><header><b>アンケート</b><small>回答ページ・デモ</small></header><main id="survey"></main><script type="module" src="survey-demo.js"></script></body>
</html>
