<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイ案件のヘルプ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#454545;background:#fff;font:14px/1.8 "Hiragino Sans","Noto Sans JP",sans-serif}main{max-width:640px;margin:auto;padding:24px 20px}h1{font-size:20px;line-height:1.4;margin:0 0 24px}h2{font-size:16px;line-height:1.5;margin:24px 0 8px}p{margin:0 0 12px}.caption{font-size:12px;color:#707A75}
  </style>
</head>
<body><main>
  <p class="caption">モック用の仮ページ</p>
  <h1>マイ案件のヘルプ</h1>
  <h2>成果ステータスを確認する</h2>
  <p>挑戦中・判定中・承認・否認のタブで、参加した案件の状態を確認できます。承認までの目安は案件詳細をご確認ください。</p>
  <h2>承認後のポイント</h2>
  <p>承認後、ポイントは付与予定に登録され、判定後に交換可能になります。マイ案件の承認表示が先になることがあります。</p>
  <h2>成果が反映されないとき</h2>
  <p>アプリの「今すぐチャレンジ！」から利用したか、獲得条件・対象外条件をご確認ください。</p>
</main></body></html>
